<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Rich Crimson to Vibrant Coral Gradient -->
    <linearGradient id="dropGrad" x1="16" y1="6" x2="48" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="55%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>

    <!-- Cyan Pulse Glow Gradient -->
    <linearGradient id="pulseGrad" x1="12" y1="41" x2="52" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>

    <!-- Drop Shadow for high contrast on light/dark browser tabs -->
    <filter id="tabShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4C0519" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Blood Droplet Silhouette -->
  <path d="M32 5C32 5 11 27.5 11 41.5C11 53.098 20.402 62.5 32 62.5C43.598 62.5 53 53.098 53 41.5C53 27.5 32 5 32 5Z" 
        fill="url(#dropGrad)" 
        filter="url(#tabShadow)"/>

  <!-- Subtle Specular Curve Highlight -->
  <path d="M22 23C16.5 31 16 39.5 17.8 44C16.8 41 16.5 35 19.5 28C22.2 21.8 28 14.5 30 11.5C26.5 16 24 20 22 23Z" 
        fill="#FFFFFF" 
        fill-opacity="0.38"/>

  <!-- ECG / Pulse Line (Base Outline) -->
  <path d="M12.5 41.5H21.5L25 33.5L29.5 49.5L35.5 24.5L40 43.5L43.5 41.5H51.5" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- ECG / Pulse Line (Vibrant Core) -->
  <path d="M12.5 41.5H21.5L25 33.5L29.5 49.5L35.5 24.5L40 43.5L43.5 41.5H51.5" 
        stroke="url(#pulseGrad)" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Heartbeat peak pulse node -->
  <circle cx="35.5" cy="24.5" r="2.2" fill="#38BDF8"/>
</svg>
